{% extends "base.html" %}
{% block title %}存活曲線與生命表{% endblock %}
{% block page_title %}存活曲線與生命表{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/survival/survival.css') }}">
{% endblock %}
{% block content %}
<section class="survival-module survival-curves" aria-labelledby="curvesHeading">
  <div class="page-head curves-page-head">
    <div>
      <h1 id="curvesHeading">存活曲線與生命表</h1>
      <p class="lead">依上傳個案資料與年度，產製存活曲線與生命表。</p>
    </div>
  </div>

  <form class="recalc-upload-card curves-upload" id="curves-form">
    <div class="section-head d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <h2 class="mb-0"><span class="dot" style="background: var(--bs-success);"></span> 存活率分析</h2>
        <span class="hint mb-0">支援 .xlsx 格式</span>
      </div>
    </div>
    <div class="recalc-upload-card__body">
      <label class="recalc-file-zone" for="case-file">
        <i class="bi bi-cloud-arrow-up"></i>
        <span>點擊或拖曳檔案至此處</span>
        <small id="recalc-file-name">尚未選擇檔案</small>
        <input id="case-file" name="case_file" type="file" accept=".xlsx" required>
      </label>
      <div class="row g-2 curves-filter-grid" id="recalc-filters" data-options-url="{{ url_for('survival_report.recalculate_options') }}"
        data-curves-url="{{ url_for('survival_report.curves_data') }}">
        <div class="col-sm curves-filter-field"><label for="recalc-start-year" class="form-label">起始年度</label><select id="recalc-start-year"
            name="start_year" class="form-select" required disabled><option>請先讀取檔案</option></select></div>
        <div class="col-sm curves-filter-field"><label for="recalc-end-year" class="form-label">結束年度</label><select id="recalc-end-year"
            name="end_year" class="form-select" required disabled><option>請先讀取檔案</option></select></div>
      </div>
      <p id="recalc-file-status" role="status"></p>
      <button class="recalc-submit-btn" type="submit" disabled>開始分析</button>
    </div>
    <p class="recalc-error" id="curves-error" role="alert" hidden><i class="bi bi-exclamation-triangle"></i>
      <span></span></p>
  </form>

  <div id="curves-results" class="curves-results" hidden>
    <div class="curves-pane">
      <div class="bg-white border border-secondary-subtle rounded shadow-sm p-4 mt-2 curves-card">
        <div class="curves-head">
          <select id="curves-cancer" class="form-select form-select-sm curves-cancer-select" aria-label="選擇癌別"></select>
          <div class="curves-tabs" role="tablist" aria-label="分析切換">
            <button type="button" class="curves-tab is-active" data-view="stage" role="tab" aria-selected="true">期別存活曲線</button>
            <button type="button" class="curves-tab" data-view="sex" role="tab" aria-selected="false">性別存活曲線</button>
          </div>
        </div>
        <div class="curves-view" data-view="stage">
          <div id="curves-chart" class="curves-chart" role="img" aria-label="Kaplan–Meier 期別存活曲線圖"></div>
          <section class="curves-life-panel">
            <h2 id="curves-life-caption" class="curves-life-caption"></h2>
            <div id="curves-life-tables"></div>
          </section>
        </div>
        <div class="curves-view" data-view="sex" hidden>
          <div id="curves-sex-chart" class="curves-chart curves-sex-chart" role="img" aria-label="Kaplan–Meier 性別存活曲線圖"></div>
        </div>
      </div>
      <section id="curves-risk-card" class="bg-white border border-secondary-subtle rounded shadow-sm p-4 mt-3 curves-card curves-risk-card" hidden>
        <h2 class="curves-risk-title">Number at risk <span>各追蹤月份仍在風險中的人數</span></h2>
        <div id="curves-risk-chart" class="curves-risk-chart" role="img" aria-label="依性別與追蹤月份分組的風險人數圖"></div>
      </section>
    </div>

  </div>

  <script src="{{ url_for('static', filename='vendor/echarts/echarts.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/echarts_data_view.js') }}"></script>
  <script src="{{ url_for('static', filename='js/survival/survival_curves.js') }}" defer></script>
</section>
{% endblock %}
