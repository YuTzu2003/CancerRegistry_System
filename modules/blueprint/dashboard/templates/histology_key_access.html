{% extends "base.html" %}
{% block title %}組織型態金鑰驗證｜癌症資料登記{% endblock %}
{% block page_title %}組織型態金鑰驗證{% endblock %}

{% block extra_head %}
<style>
  .histology-access { max-width: 560px; margin: 5vh auto; }
  .histology-access-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
  .histology-access-icon { display: grid; width: 42px; height: 42px; place-items: center; border-radius: var(--radius-sm); background: var(--warning-soft); color: var(--warning); font-size: 1.2rem; }
</style>
{% endblock %}

{% block content %}
<section class="histology-access">
  <div class="histology-access-card p-4 p-md-5">
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="histology-access-icon"><i class="bi bi-key"></i></div>
      <div>
        <h1 class="h4 mb-1">組織型態資料授權</h1>
        <p class="text-secondary small mb-0">請輸入已啟用的金鑰以進入資料維護頁面。</p>
      </div>
    </div>
    <form method="post" action="{{ url_for('histology_mapping.verify_histology_mapping_access') }}">
      <input type="hidden" name="return_year" value="{{ return_year }}">
      <input type="hidden" name="return_column" value="{{ return_column }}">
      <input type="hidden" name="return_q" value="{{ return_q }}">
      <label class="form-label fw-semibold" for="histology-api-key">授權金鑰</label>
      <input id="histology-api-key" name="api_key" class="form-control" type="password" autocomplete="off" required autofocus>
      <p class="form-text mt-2">Key 必須屬於目前登入帳號，且仍在啟用期間內。</p>
      <button class="btn btn-dark w-100 mt-3 d-flex justify-content-center align-items-center" type="submit"><i class="bi bi-shield-check me-1"></i>驗證並進入</button>
    </form>
  </div>
</section>
{% endblock %}
