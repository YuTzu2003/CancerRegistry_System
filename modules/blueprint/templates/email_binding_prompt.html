{% extends "base.html" %}
{% block title %}綁定帳號 Email｜癌症資料登記{% endblock %}
{% block page_title %}帳號安全設定{% endblock %}
{% block content %}
<div class="card-flat" style="max-width:700px; margin:32px auto;"><div style="padding:36px; text-align:center;"><i class="bi bi-envelope-plus" style="font-size:44px; color:#2563eb;"></i><h2 class="mt-3">建議綁定 Email</h2><p class="text-secondary">綁定後，忘記密碼時可收取六位數驗證碼自行重設。Email 僅用於帳號驗證。</p>{% if email_enabled %}<form method="post" class="d-inline"><button class="btn btn-primary px-4">前往綁定</button></form>{% else %}<p class="text-danger small">Email 驗證服務目前未啟用，請聯絡資訊室。</p>{% endif %}<form method="post" class="d-inline ms-2"><input type="hidden" name="action" value="later"><button class="btn btn-outline-secondary">暫時略過</button></form><form method="post" class="mt-3"><input type="hidden" name="action" value="dismiss"><button class="btn btn-link text-secondary small">不綁定，下次不再顯示</button></form></div></div>
{% endblock %}
