{% extends "login_shell.html" %}
{% block auth_icon %}bi-key{% endblock %}
{% block auth_title %}忘記密碼{% endblock %}
{% block auth_subtitle %}輸入員工帳號，取得密碼重設驗證碼。{% endblock %}
{% block auth_form %}
<div class="account-help"><i class="bi bi-info-circle"></i><span>僅已完成 Email 綁定的帳號可自行重設密碼；尚未綁定者請聯絡資訊室協助。</span></div>
<form method="post">
  <div class="form-field"><label for="userid">員工帳號</label><div class="input-with-icon"><i class="bi bi-person text-muted"></i><input id="userid" type="text" name="userid" class="form-control" placeholder="請輸入員工帳號" required autofocus></div></div>
  <button class="btn btn-dark login-btn"><i class="bi bi-send me-2"></i>寄送驗證碼</button>
</form>
<a class="account-back" href="{{ url_for('auth.login') }}"><i class="bi bi-arrow-left"></i>返回登入</a>
{% endblock %}
