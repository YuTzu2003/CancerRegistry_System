<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>登入｜癌症資料登記</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/login.css">
</head>

<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <img src="/static/NTUH.png" alt="NTUH Logo" class="login-img-logo">
        <h1 class="login-title">癌症登記資料平台</h1>
        <p class="login-subtitle">請輸入您的員工帳號與密碼以登入系統</p>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <script>
            document.addEventListener("DOMContentLoaded", function() {
              {% for category, msg in messages %}
                {% set icon = 'success' if category == 'success' else ('error' if category == 'danger' else ('warning' if category == 'warning' else 'info')) %}
                {% set title = '成功' if category == 'success' else ('錯誤' if category == 'danger' else ('警告' if category == 'warning' else '提示')) %}
                Swal.fire({
                  icon: '{{ icon }}',
                  title: '{{ title }}',
                  text: {{ msg|tojson|safe }},
                  confirmButtonColor: '#2563eb'
                });
              {% endfor %}
            });
          </script>
        {% endif %}
      {% endwith %}

      {% if error %}
        <script>
          document.addEventListener("DOMContentLoaded", function() {
            Swal.fire({
              icon: 'error',
              title: '錯誤',
              text: {{ error|tojson|safe }},
              confirmButtonColor: '#2563eb'
            });
          });
        </script>
      {% endif %}

      <form method="POST">
        
        <div class="form-field">
          <label>User ID</label>
          <div class="input-with-icon">
            <i class="bi bi-person text-muted"></i>
            <input type="text" name="userid" class="form-control" placeholder="請輸入員工編號" required>
          </div>
        </div>

        <div class="form-field">
          <label>Password</label>
          <div class="input-with-icon">
            <i class="bi bi-lock text-muted"></i>
            <input type="password" name="password" class="form-control" placeholder="請輸入密碼" required>
          </div>
        </div>

        <button type="submit" class="btn btn-dark btn-block login-btn">登入系統</button>
      </form>

      <div class="login-footer">
        &copy; 2026 NFU. All rights reserved.
      </div>

    </div>
  </div>

</body>
</html>
