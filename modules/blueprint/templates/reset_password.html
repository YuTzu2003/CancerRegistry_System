{% extends "login_shell.html" %}
{% block auth_icon %}bi-shield-check{% endblock %}
{% block auth_title %}重設密碼{% endblock %}
{% block auth_subtitle %}帳號：{{ userid }}{% endblock %}
{% block auth_form %}
<div class="account-help"><i class="bi bi-envelope-check"></i><span>請輸入 Email 收到的六位數驗證碼，並設定新密碼。</span></div>
<form method="post">
  <div class="form-field"><label for="code">六位數驗證碼</label><div class="input-with-icon"><i class="bi bi-shield-check text-muted"></i><input id="code" type="text" name="code" class="form-control" placeholder="例如：123456" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus></div></div>
  <div class="form-field"><label for="password">新密碼</label><div class="input-with-icon"><i class="bi bi-lock text-muted"></i><input id="password" type="password" name="password" class="form-control" placeholder="請輸入新密碼" required></div></div>
  <div class="form-field"><label for="confirm_password">再次輸入新密碼</label><div class="input-with-icon"><i class="bi bi-lock-fill text-muted"></i><input id="confirm_password" type="password" name="confirm_password" class="form-control" placeholder="再次輸入新密碼" required></div></div>
  <button class="btn btn-dark login-btn"><i class="bi bi-check2-circle me-2"></i>確認重設</button>
</form>
<a class="account-back" href="{{ url_for('auth.forgot_password') }}"><i class="bi bi-arrow-left"></i>重新申請驗證碼</a>
{% endblock %}
